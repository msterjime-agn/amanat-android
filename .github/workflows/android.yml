name: Build Amanat Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AMANAT_VERSION_CODE: ${{ github.run_number }}
      SIGNING_BASE64: ${{ secrets.AMANAT_KEYSTORE_BASE64 }}
      AMANAT_STORE_PASSWORD: ${{ secrets.AMANAT_STORE_PASSWORD }}
      AMANAT_KEY_ALIAS: ${{ secrets.AMANAT_KEY_ALIAS }}
      AMANAT_KEY_PASSWORD: ${{ secrets.AMANAT_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check accounting and numbering logic
        run: node --test tests/*.test.mjs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure release signature when supplied
        if: env.SIGNING_BASE64 != ''
        shell: bash
        run: |
          if [ -z "$AMANAT_STORE_PASSWORD" ] || [ -z "$AMANAT_KEY_ALIAS" ] || [ -z "$AMANAT_KEY_PASSWORD" ]; then
            echo 'All four AMANAT signing secrets are required.' >&2
            exit 1
          fi
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$RUNNER_TEMP/amanat-release.jks"
          printf 'AMANAT_KEYSTORE=%s\n' "$RUNNER_TEMP/amanat-release.jks" >> "$GITHUB_ENV"
      - name: Build installable test APK
        if: env.SIGNING_BASE64 == ''
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Build signed release APK
        if: env.SIGNING_BASE64 != ''
        run: gradle --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify APK signature and prepare download
        shell: bash
        run: |
          mkdir -p output
          if [ -n "$SIGNING_BASE64" ]; then
            cp app/build/outputs/apk/release/app-release.apk output/Amanat-1.0.0.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk output/Amanat-1.0.0-test.apk
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/*.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - name: Download APK here
        uses: actions/upload-artifact@v4
        with:
          name: Amanat-Android-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/amanat-release.jks"
